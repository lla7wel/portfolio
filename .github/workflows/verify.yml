name: Portfolio verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: portfolio-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install PDF and browser tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes poppler-utils
          npx playwright install --with-deps chromium firefox webkit

      - name: Validate content and build
        run: |
          npm run validate:claims
          npm run validate:locales
          npm run validate:svg
          npm run verify:resume
          npm run check
          npm run build
          npm run validate:links

      - name: Run cross-browser product checks
        run: npx playwright test --workers=1 --ignore-snapshots
