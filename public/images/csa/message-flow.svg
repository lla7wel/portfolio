<svg xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" viewBox="0 0 960 620"><defs><linearGradient id="acc2" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#818cf8"/></linearGradient><marker id="fa" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#64748b" d="m0 0 10 5-10 5z"/></marker></defs><style>.hot,.step{fill:#0f172a;stroke:#334155;stroke-width:1.2}.hot{stroke:url(#acc2);stroke-width:1.6}.t{fill:#e2e8f0;font-size:13.5px;font-weight:600}.s{fill:#94a3b8;font-size:11px}.lbl{fill:#64748b;font-size:10.5px}.e{stroke:#64748b;stroke-width:1.4;fill:none;marker-end:url(#fa)}</style><path fill="#020617" d="M0 0h960v620H0z"/><text x="30" y="38" fill="#f8fafc" font-size="19" font-weight="700">A customer message, end to end</text><text x="30" y="58" class="s">Every guard exists because of a real production incident</text><rect width="270" height="58" x="30" y="90" class="step" rx="12"/><text x="48" y="114" class="t">1 · Webhook receipt</text><text x="48" y="132" class="s">X-Hub-Signature-256 verified, mid-deduped</text><rect width="270" height="58" x="30" y="178" class="step" rx="12"/><text x="48" y="202" class="t">2 · Ingest</text><text x="48" y="220" class="s">upsert customer + conversation, store message</text><rect width="270" height="58" x="30" y="266" class="hot" rx="12"/><text x="48" y="290" class="t">3 · Burst batching (5s)</text><text x="48" y="308" class="s">only the newest message owns the merged turn</text><rect width="270" height="72" x="30" y="354" class="step" rx="12"/><text x="48" y="378" class="t">4 · Context load</text><text x="48" y="396" class="s">current AI Control + customer memory</text><text x="48" y="411" class="s">+ verified runtime facts (kept separate)</text><rect width="270" height="100" x="360" y="90" class="hot" rx="12"/><text x="378" y="114" class="t">5a · Image turn</text><text x="378" y="132" class="s">8-step hybrid matcher: exact URL → dHash →</text><text x="378" y="147" class="s">learned corrections → fingerprints → vision</text><text x="378" y="162" class="s">describe → code/barcode → keyword+vector</text><text x="378" y="177" class="s">→ visual re-rank</text><rect width="270" height="72" x="360" y="220" class="step" rx="12"/><text x="378" y="244" class="t">5b · Text turn</text><text x="378" y="262" class="s">URL/code/barcode/keyword/vector resolver;</text><text x="378" y="277" class="s">order/refund → warm human handoff</text><rect width="270" height="86" x="360" y="322" class="hot" rx="12"/><text x="378" y="346" class="t">6 · Compile + compose</text><text x="378" y="364" class="s">immutable policy + exact applicable AI Control</text><text x="378" y="379" class="s">+ runtime JSON + read-only catalog tools</text><text x="378" y="394" class="s">prices only from active_price — never invented</text><rect width="240" height="318" x="690" y="90" class="hot" rx="12"/><text x="708" y="114" class="t">7 · deliverAndStore</text><text x="708" y="140" class="s">◆ supersede guard: newer inbound</text><text x="722" y="155" class="s">arrived mid-turn → abandon reply</text><text x="708" y="178" class="s">◆ sanitizer gate: strips any leaked</text><text x="722" y="193" class="s">tool/JSON/system text</text><text x="708" y="216" class="s">◆ ai_enabled re-check closes the</text><text x="722" y="231" class="s">admin-pause race</text><text x="708" y="254" class="s">◆ caption first, then ≤3 real catalog</text><text x="722" y="269" class="s">photos (public HTTPS only)</text><text x="708" y="292" class="s">◆ honest delivery: delivered_at only</text><text x="722" y="307" class="s">on a confirmed Meta send</text><text x="708" y="330" class="s">◆ failures logged, never shown as</text><text x="722" y="345" class="s">sent in the inbox</text><text x="708" y="375" class="s">→ outbound message stored with</text><text x="722" y="390" class="s">full diagnostics in ai_meta</text><rect width="270" height="58" x="360" y="450" class="step" rx="12"/><text x="378" y="474" class="t">8 · Memory update</text><text x="378" y="492" class="s">recent products + compiled memory-summary task</text><rect width="240" height="58" x="690" y="450" class="step" rx="12"/><text x="708" y="474" class="t">Learning loop</text><text x="708" y="492" class="s">admin corrections → dHash fingerprints</text><path d="M165 148v30" class="e"/><path d="M165 236v30" class="e"/><path d="M165 324v30" class="e"/><path d="M300 390c30 0 30-240 60-250" class="e"/><text x="308" y="360" class="lbl">image</text><path d="M300 398c35 0 35-136 60-142" class="e"/><text x="308" y="420" class="lbl">text</text><path d="M495 190v30" class="e"/><path d="M495 292v30" class="e"/><path d="M630 365h60" class="e"/><path d="M495 408v42" class="e"/><path d="M810 408v42" class="e"/><text x="820" y="432" class="lbl">admin reviews mismatches</text></svg>