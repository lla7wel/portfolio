<svg viewBox="0 0 960 620" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <style>
    .step{fill:#0f172a;stroke:#334155;stroke-width:1.2}
    .hot{fill:#111c31;stroke:url(#accent);stroke-width:1.6}
    .t{fill:#e2e8f0;font-size:13.5px;font-weight:600}
    .s{fill:#94a3b8;font-size:11px}
    .lbl{fill:#64748b;font-size:10.5px}
    .edge{stroke:#64748b;stroke-width:1.4;fill:none;marker-end:url(#arrow)}
  </style>
  <rect width="960" height="620" fill="#020617"/>
  <text x="30" y="38" fill="#f8fafc" font-size="19" font-weight="700">A customer request, durably processed end to end</text>
  <text x="30" y="58" class="s">Messenger or Instagram Direct · every external side effect crosses the transactional outbox</text>

  <rect x="30" y="92" width="260" height="76" rx="12" class="hot"/>
  <text x="48" y="118" class="t">1 · Verify Meta webhook</text>
  <text x="48" y="139" class="s">signature check · event identity · channel</text>
  <text x="48" y="156" class="s">Facebook Messenger or Instagram Direct</text>

  <rect x="30" y="206" width="260" height="88" rx="12" class="hot"/>
  <text x="48" y="232" class="t">2 · Persist before acknowledging</text>
  <text x="48" y="253" class="s">event + inbound message + durable job</text>
  <text x="48" y="271" class="s">one database transaction; failure returns 503</text>

  <rect x="30" y="332" width="260" height="88" rx="12" class="step"/>
  <text x="48" y="358" class="t">3 · Worker claims the job</text>
  <text x="48" y="379" class="s">leased with FOR UPDATE SKIP LOCKED</text>
  <text x="48" y="397" class="s">retryable, resumable, visible to operators</text>

  <rect x="350" y="92" width="260" height="88" rx="12" class="step"/>
  <text x="368" y="118" class="t">4 · Build one customer turn</text>
  <text x="368" y="139" class="s">debounce message bursts · newest turn wins</text>
  <text x="368" y="157" class="s">load current conversation + runtime controls</text>

  <rect x="350" y="218" width="260" height="108" rx="12" class="hot"/>
  <text x="368" y="244" class="t">5 · Resolve product evidence</text>
  <text x="368" y="265" class="s">code / barcode / text / vector retrieval</text>
  <text x="368" y="283" class="s">photo: dHash → learned correction → vision</text>
  <text x="368" y="301" class="s">empty candidates return none — never a guess</text>

  <rect x="350" y="364" width="260" height="108" rx="12" class="hot"/>
  <text x="368" y="390" class="t">6 · Compose under guards</text>
  <text x="368" y="411" class="s">catalog-grounded price and identity</text>
  <text x="368" y="429" class="s">sanitizer · supersede · ai_enabled re-check</text>
  <text x="368" y="447" class="s">orders / refunds / complaints → human handoff</text>

  <rect x="670" y="130" width="260" height="116" rx="12" class="hot"/>
  <text x="688" y="156" class="t">7 · Commit the outbox intent</text>
  <text x="688" y="177" class="s">outbound message and delivery intent</text>
  <text x="688" y="195" class="s">commit together with conversation state</text>
  <text x="688" y="213" class="s">idempotency key blocks duplicate sends</text>
  <text x="688" y="231" class="s">ambiguous timeout becomes “uncertain”</text>

  <rect x="670" y="302" width="260" height="116" rx="12" class="hot"/>
  <text x="688" y="328" class="t">8 · Deliver and confirm</text>
  <text x="688" y="349" class="s">worker sends through the correct Meta channel</text>
  <text x="688" y="367" class="s">delivered only after provider confirmation</text>
  <text x="688" y="385" class="s">failure stays visible and safely retryable</text>
  <text x="688" y="403" class="s">handoff flags the conversation for an admin</text>

  <rect x="350" y="520" width="580" height="58" rx="12" class="step"/>
  <text x="368" y="545" class="t">Operational record</text>
  <text x="368" y="563" class="s">audit trail · job attempts · provider response · readiness · admin ownership</text>

  <path class="edge" d="M160 168 L160 206"/>
  <path class="edge" d="M160 294 L160 332"/>
  <path class="edge" d="M290 376 C325 376,325 136,350 136"/>
  <path class="edge" d="M480 180 L480 218"/>
  <path class="edge" d="M480 326 L480 364"/>
  <path class="edge" d="M610 418 C645 418,640 188,670 188"/>
  <path class="edge" d="M800 246 L800 302"/>
  <path class="edge" d="M800 418 L800 520"/>
</svg>
