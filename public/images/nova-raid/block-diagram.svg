<svg xmlns="http://www.w3.org/2000/svg" width="860" height="520" font-family="Menlo, Consolas, monospace" viewBox="0 0 860 520"><style>.periph{fill:#141828;stroke:#8a8aa0;stroke-width:1.2}.t{fill:#e8e8f0;font-size:14px}.s{fill:#9a9ab0;font-size:10px}.bus,.sig{stroke:#50dcff;stroke-width:2;fill:none}.sig{stroke:#8a8aa0;stroke-width:1.5}.dir{fill:#eb50ff;font-size:11px}</style><path fill="#0a0c16" d="M0 0h860v520H0z"/><text x="430" y="30" fill="#fff" font-size="18" text-anchor="middle">NOVA RAID - Hardware Block Diagram</text><text x="430" y="48" class="s" text-anchor="middle">52Pi Pico Breadboard Kit Plus (EP-0172) + Raspberry Pi Pico W</text><rect width="200" height="180" x="330" y="180" rx="6" style="fill:#141828;stroke:#50dcff;stroke-width:1.5;rx:6"/><text x="430" y="205" class="t" text-anchor="middle">Raspberry Pi Pico W</text><text x="430" y="222" class="s" text-anchor="middle">RP2040 @ 125 MHz</text><text x="430" y="252" class="s" text-anchor="middle">core 0: game logic + render</text><text x="430" y="268" class="s" text-anchor="middle">core 1: SPI frame streaming</text><text x="430" y="290" class="s" text-anchor="middle">264 KiB SRAM (2x 75 KiB fb)</text><text x="430" y="306" class="s" text-anchor="middle">2 MiB flash</text><text x="430" y="322" class="s" text-anchor="middle">last 4 KiB sector: high scores</text><text x="430" y="344" class="s" text-anchor="middle">USB CDC: diagnostics log</text><rect width="210" height="110" x="620" y="170" class="periph" rx="4"/><text x="725" y="195" class="t" text-anchor="middle">3.5&quot; TFT 480x320</text><text x="725" y="212" class="s" text-anchor="middle">ST7796S controller</text><text x="725" y="228" class="s" text-anchor="middle">RGB565, landscape</text><text x="725" y="248" class="s" text-anchor="middle">FT6236 cap. touch on I2C0</text><text x="725" y="262" class="s" text-anchor="middle">(present, unused by game)</text><path d="M530 225h90" class="bus"/><text x="575" y="215" style="fill:#50dcff;font-size:11px" text-anchor="middle">SPI0 62.5 MHz</text><text x="575" y="240" class="s" text-anchor="middle">GP2 SCK / GP3 MOSI</text><text x="575" y="254" class="s" text-anchor="middle">GP5 CS / GP6 DC / GP7 RST</text><path fill="#50dcff" d="m610 225 10-5v10Z" class="bus"/><rect width="200" height="70" x="30" y="120" class="periph" rx="4"/><text x="130" y="145" class="t" text-anchor="middle">Analog joystick</text><text x="130" y="162" class="s" text-anchor="middle">PSP-style, 2 pots</text><text x="130" y="178" class="s" text-anchor="middle">X: GP26/ADC0  Y: GP27/ADC1</text><path d="m220 155 110 55" class="sig"/><text x="268" y="168" class="dir">analog in</text><rect width="200" height="70" x="30" y="220" class="periph" rx="4"/><text x="130" y="245" class="t" text-anchor="middle">Push buttons x2</text><text x="130" y="262" class="s" text-anchor="middle">BTN1 fire: GP15</text><text x="130" y="278" class="s" text-anchor="middle">BTN2 bomb: GP14 (active low)</text><path d="m220 255 110 5" class="sig"/><text x="268" y="248" class="dir">gpio in</text><rect width="180" height="60" x="40" y="320" stroke-dasharray="4 3" class="periph" rx="4"/><text x="130" y="345" class="s" text-anchor="middle">Cap. touch panel</text><text x="130" y="362" class="s" text-anchor="middle">I2C0 GP8 SDA / GP9 SCL</text><path stroke-dasharray="4 3" d="m220 345 110-35" class="sig"/><rect width="210" height="56" x="620" y="320" class="periph" rx="4"/><text x="725" y="343" class="t" text-anchor="middle">Passive buzzer</text><text x="725" y="360" class="s" text-anchor="middle">GP13, PWM tone + duty volume</text><path d="m530 320 90 22" class="sig"/><text x="568" y="330" class="dir">pwm out</text><rect width="210" height="56" x="620" y="400" class="periph" rx="4"/><text x="725" y="423" class="t" text-anchor="middle">RGB LED (WS2812)</text><text x="725" y="440" class="s" text-anchor="middle">GP12, PIO0 @ 800 kHz</text><path d="m500 360 120 64" class="sig"/><text x="548" y="400" class="dir">pio out</text><rect width="200" height="66" x="30" y="420" class="periph" rx="4"/><text x="130" y="443" class="t" text-anchor="middle">Panel LEDs</text><text x="130" y="460" class="s" text-anchor="middle">D1 GP16: bomb ready</text><text x="130" y="476" class="s" text-anchor="middle">D2 GP17: low-health blink</text><path d="m220 450 140-90" class="sig"/><text x="272" y="418" class="dir">gpio out</text><rect width="240" height="56" x="310" y="430" class="periph" rx="4"/><text x="430" y="453" class="t" text-anchor="middle">Power</text><text x="430" y="470" class="s" text-anchor="middle">USB 5V -&gt; VSYS; 3V3 rail to kit</text><path d="M430 430v-70" class="sig"/></svg>