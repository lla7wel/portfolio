<svg xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" viewBox="0 0 1240 950"><defs><style>.comp{fill:#10151b;stroke:#3fb950;stroke-width:1.2}.name{fill:#e6edf3;font-size:14px;font-weight:700}.sub{fill:#7d8590;font-size:11px}.pin{fill:#e6edf3;font-size:11.5px}.plabel{fill:#7d8590;font-size:10px}.wire{fill:none;stroke-width:1.6}.w-lcd{stroke:#58a6ff}.w-sen{stroke:#d29922}.w-out{stroke:#bc8cff}.w-pwr{stroke:#f85149}.w-gnd{stroke:#7d8590;stroke-dasharray:5 3}.leg{fill:#e6edf3;font-size:11px}</style></defs><path fill="#0d1117" d="M0 0h1240v950H0z"/><text x="620" y="36" style="fill:#e6edf3;font-size:21px;font-weight:700" text-anchor="middle">Smart Home Appliance Controller — Wiring Diagram</text><text x="620" y="56" class="sub" text-anchor="middle">Arduino UNO R3 · DHT11 · LDR · LCD1602 (4-bit) · PN2222 fan driver · state LEDs · active buzzer</text><rect width="240" height="640" x="500" y="90" rx="10" style="fill:#161b22;stroke:#58a6ff;stroke-width:1.5"/><text x="620" y="118" class="name" text-anchor="middle">Arduino UNO R3</text><text x="620" y="136" class="sub" text-anchor="middle">ATmega328P · 5V logic</text><text x="508" y="174" class="pin">5V</text><text x="508" y="204" class="pin">GND</text><text x="508" y="264" class="pin">A2</text><text x="508" y="304" class="pin">A3</text><text x="508" y="344" class="pin">A4</text><text x="508" y="384" class="pin">A5</text><text x="508" y="424" class="pin">D12</text><text x="508" y="464" class="pin">A1</text><text x="545" y="264" class="plabel">→ RS</text><text x="545" y="304" class="plabel">→ E</text><text x="545" y="344" class="plabel">→ D4</text><text x="545" y="384" class="plabel">→ D5</text><text x="545" y="424" class="plabel">→ D6</text><text x="545" y="464" class="plabel">→ D7</text><g text-anchor="end"><text x="732" y="164" class="pin">D13</text><text x="732" y="204" class="pin">A0</text><text x="732" y="264" class="pin">D2</text><text x="732" y="294" class="pin">D3</text><text x="732" y="354" class="pin">D7</text><text x="732" y="384" class="pin">D8</text><text x="732" y="414" class="pin">D10</text><text x="732" y="474" class="pin">D6</text><text x="732" y="534" class="pin">D11</text><text x="732" y="604" class="pin">5V</text><text x="732" y="644" class="pin">GND</text></g><text x="726" y="588" class="plabel" text-anchor="end">→ breadboard rails feed</text><text x="726" y="620" class="plabel" text-anchor="end">DHT11, LDR, LCD backlight</text><rect width="280" height="500" x="60" y="120" class="comp" rx="8"/><text x="200" y="148" class="name" text-anchor="middle">LCD1602</text><text x="200" y="165" class="sub" text-anchor="middle">HD44780 · 4-bit parallel mode</text><g text-anchor="end"><text x="332" y="199" class="pin">VSS</text><text x="332" y="229" class="pin">VDD</text><text x="332" y="259" class="pin">V0</text><text x="332" y="289" class="pin">RS</text><text x="332" y="319" class="pin">RW</text><text x="332" y="349" class="pin">E</text><text x="332" y="379" class="pin">D4</text><text x="332" y="409" class="pin">D5</text><text x="332" y="439" class="pin">D6</text><text x="332" y="469" class="pin">D7</text><text x="332" y="529" class="pin">A</text><text x="332" y="559" class="pin">K</text></g><text x="70" y="199" class="plabel">GND</text><text x="70" y="229" class="plabel">5V</text><text x="70" y="259" class="plabel">contrast (pot wiper)</text><text x="70" y="319" class="plabel">GND (write-only)</text><text x="70" y="529" class="plabel">backlight +5V</text><text x="70" y="559" class="plabel">backlight GND</text><path d="M340 195h60v5h100" class="wire w-gnd"/><path d="M340 225h70v-55h90" class="wire w-pwr"/><path d="M340 285h90v-25h70M340 345h100v-45h60" class="wire w-lcd"/><path d="M340 375h110v-35h50M340 405h120v-25h40M340 435h130v-15h30M340 465h140v-5h20" class="wire w-lcd"/><rect width="280" height="80" x="60" y="650" class="comp" rx="8"/><text x="200" y="676" class="name" text-anchor="middle">10k Potentiometer</text><text x="200" y="695" class="sub" text-anchor="middle">ends → 5V and GND</text><text x="200" y="712" class="sub" text-anchor="middle">wiper → LCD V0 (contrast)</text><path d="M200 650v-35h146V255h-6" class="wire w-lcd" opacity=".8"/><rect width="300" height="100" x="880" y="110" class="comp" rx="8"/><text x="1030" y="136" class="name" text-anchor="middle">DHT11 — Temp / Humidity</text><text x="888" y="160" class="pin">DATA</text><text x="888" y="180" class="pin">VCC → 5V</text><text x="888" y="200" class="pin">GND → GND</text><text x="1172" y="160" class="plabel" text-anchor="end">single-wire digital</text><path d="M732 160h58v-4h90" class="wire w-sen"/><rect width="300" height="90" x="880" y="240" class="comp" rx="8"/><text x="1030" y="266" class="name" text-anchor="middle">Photoresistor (LDR)</text><text x="1030" y="288" class="sub" text-anchor="middle">5V ─[ LDR ]─●─[ 10kΩ ]─ GND</text><text x="1030" y="308" class="sub" text-anchor="middle">divider node ● → A0 (0–1023)</text><path d="M732 200h68v85h80" class="wire w-sen"/><rect width="300" height="90" x="880" y="360" class="comp" rx="8"/><text x="1030" y="386" class="name" text-anchor="middle">Push Buttons</text><text x="888" y="410" class="pin">MODE  — D2 → GND</text><text x="888" y="432" class="pin">SPEED — D3 → GND</text><text x="1172" y="410" class="plabel" text-anchor="end">INPUT_PULLUP</text><text x="1172" y="432" class="plabel" text-anchor="end">INPUT_PULLUP</text><path d="M732 260h78v146h70" class="wire w-out"/><path d="M732 290h68v138h80" class="wire w-out"/><rect width="300" height="110" x="880" y="480" class="comp" rx="8"/><text x="1030" y="506" class="name" text-anchor="middle">State LEDs</text><text x="888" y="530" class="pin">D7  ─[220Ω]─ RED   ─ GND</text><text x="888" y="552" class="pin">D8  ─[220Ω]─ GREEN ─ GND</text><text x="888" y="574" class="pin">D10 ─[220Ω]─ BLUE  ─ GND</text><path d="M732 350h88v176h60" class="wire w-out"/><path d="M732 380h78v168h70" class="wire w-out"/><path d="M732 410h68v160h80" class="wire w-out"/><rect width="300" height="70" x="880" y="620" class="comp" rx="8"/><text x="1030" y="646" class="name" text-anchor="middle">Active Buzzer</text><text x="1030" y="668" class="sub" text-anchor="middle">D6 → (+)  ·  (−) → GND</text><path d="M732 470h88v180h60" class="wire w-out"/><rect width="560" height="160" x="620" y="760" class="comp" rx="8"/><text x="900" y="788" class="name" text-anchor="middle">DC Fan Driver (low-side switch)</text><text x="640" y="818" class="pin">D11 ─[ 1kΩ ]─ base   PN2222 (NPN)</text><text x="640" y="842" class="pin">emitter → GND (common with battery −)</text><text x="640" y="866" class="pin">collector → motor (−) · motor (+) → battery pack (+)</text><text x="640" y="890" class="pin">1N4007 flyback diode across motor (cathode to +)</text><text x="1168" y="818" class="plabel" text-anchor="end">PWM speed control</text><text x="1168" y="842" class="plabel" text-anchor="end">external battery pack</text><path d="M732 530h38v230" class="wire w-out"/><path d="M732 640h18v100h-90v20" class="wire w-gnd"/><g transform="translate(60 770)"><rect width="280" height="150" class="comp" rx="8"/><text x="140" y="26" class="name" text-anchor="middle">Legend</text><path d="M18 48h40" class="wire w-lcd"/><text x="68" y="52" class="leg">LCD parallel bus</text><path d="M18 72h40" class="wire w-sen"/><text x="68" y="76" class="leg">Sensor inputs</text><path d="M18 96h40" class="wire w-out"/><text x="68" y="100" class="leg">GPIO / PWM outputs</text><path d="M18 120h40" class="wire w-pwr"/><text x="68" y="124" class="leg">5V power</text><path d="M18 140h40" class="wire w-gnd"/><text x="68" y="144" class="leg">Ground</text></g><text x="410" y="770" class="sub">All grounds are common:</text><text x="410" y="788" class="sub">UNO GND, breadboard rail,</text><text x="410" y="806" class="sub">battery (−), LCD VSS/RW/K.</text></svg>