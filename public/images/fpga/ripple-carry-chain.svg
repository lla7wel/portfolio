<svg viewBox="0 0 960 300" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <linearGradient id="hl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
  <style>
    .fa { fill:#0f172a; stroke:url(#hl); stroke-width:1.6; }
    .t { fill:#e2e8f0; font-size:14px; font-weight:600; }
    .s { fill:#94a3b8; font-size:11px; }
    .lbl { fill:#64748b; font-size:11px; }
    .e { stroke:#64748b; stroke-width:1.5; fill:none; marker-end:url(#ar); }
    .carry { stroke:#22d3ee; stroke-width:1.8; fill:none; marker-end:url(#ar); }
  </style>
  <rect width="960" height="300" fill="#020617"/>
  <text x="30" y="36" fill="#f8fafc" font-size="17" font-weight="700">4-bit ripple-carry adder — four full_adder instances</text>
  <text x="30" y="55" class="s">Each stage's carry-out feeds the carry-in of the next more significant stage</text>

  <!-- stages -->
  <g>
    <rect x="120" y="120" width="130" height="80" rx="10" class="fa"/>
    <text x="150" y="152" class="t">FA0</text>
    <text x="150" y="172" class="s">A(0) B(0)</text>

    <rect x="330" y="120" width="130" height="80" rx="10" class="fa"/>
    <text x="360" y="152" class="t">FA1</text>
    <text x="360" y="172" class="s">A(1) B(1)</text>

    <rect x="540" y="120" width="130" height="80" rx="10" class="fa"/>
    <text x="570" y="152" class="t">FA2</text>
    <text x="570" y="172" class="s">A(2) B(2)</text>

    <rect x="750" y="120" width="130" height="80" rx="10" class="fa"/>
    <text x="780" y="152" class="t">FA3</text>
    <text x="780" y="172" class="s">A(3) B(3)</text>
  </g>

  <!-- carry chain -->
  <path class="carry" d="M40 160 L120 160"/>
  <text x="48" y="150" class="lbl">Cin</text>
  <path class="carry" d="M250 160 L330 160"/>
  <text x="276" y="150" fill="#22d3ee" font-size="11">c01</text>
  <path class="carry" d="M460 160 L540 160"/>
  <text x="486" y="150" fill="#22d3ee" font-size="11">c12</text>
  <path class="carry" d="M670 160 L750 160"/>
  <text x="696" y="150" fill="#22d3ee" font-size="11">c23</text>
  <path class="carry" d="M880 160 L935 160"/>
  <text x="892" y="150" class="lbl">Cout</text>

  <!-- inputs from top -->
  <path class="e" d="M185 90 L185 120"/>
  <path class="e" d="M395 90 L395 120"/>
  <path class="e" d="M605 90 L605 120"/>
  <path class="e" d="M815 90 L815 120"/>

  <!-- sums out bottom -->
  <path class="e" d="M185 200 L185 235"/>
  <text x="175" y="255" class="t">S(0)</text>
  <path class="e" d="M395 200 L395 235"/>
  <text x="385" y="255" class="t">S(1)</text>
  <path class="e" d="M605 200 L605 235"/>
  <text x="595" y="255" class="t">S(2)</text>
  <path class="e" d="M815 200 L815 235"/>
  <text x="805" y="255" class="t">S(3)</text>
</svg>
